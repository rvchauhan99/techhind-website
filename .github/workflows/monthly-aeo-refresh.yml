name: Monthly AEO Refresh

on:
  schedule:
    # 1st of month 10:00 IST = 04:30 UTC
    - cron: "30 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-aeo-refresh
  cancel-in-progress: false

jobs:
  aeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh llms.txt / llms-full.txt
        id: aeo
        run: node scripts/refresh-aeo-llms.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/llms.txt public/llms-full.txt
          if git diff --cached --quiet; then
            echo "No AEO changes"
            exit 0
          fi
          git commit -m "chore(seo): refresh AEO llms.txt from handbook"
          git push origin HEAD:${{ github.ref_name }}

      - name: Summary
        run: |
          echo "## AEO refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "Updated public/llms.txt and llms-full.txt from handbook + blog index." >> "$GITHUB_STEP_SUMMARY"
